# =============================================================================
# gradle.properties — Centralized version & build configuration
# =============================================================================
#
# WHY THIS FILE EXISTS
# --------------------
# In a multi-module project, the same library versions are referenced in many
# build files. If every module hard-codes its own version string, you quickly
# fall into "dependency hell": Service A pulls Spring Boot 3.2.3, Service B
# accidentally pulls 3.1.0, and now a shared transitive library resolves to two
# incompatible versions at runtime, producing NoSuchMethodError / NoClassDefFound
# explosions that are extremely painful to debug.
#
# By declaring EVERY version string here, as a single source of truth, we get:
#   * One place to bump a version (change it once, every module updates).
#   * Guaranteed alignment across all microservices.
#   * Self-documenting "bill of materials" for the whole platform.
#
# Gradle automatically exposes every key in this file as a project property,
# so build.gradle.kts files can read them via `project.property("...")`.
# =============================================================================

# --- Core platform versions -------------------------------------------------
# Spring Boot brings the curated dependency management (the "BOM") that aligns
# hundreds of transitive libraries (Jackson, Tomcat, Hibernate, etc.).
springBootVersion=3.2.3
# Spring Cloud must be matched to the Spring Boot minor line. 2023.0.x ("Leyton")
# is the release train compatible with Spring Boot 3.2.x.
springCloudVersion=2023.0.0

# Java language level. 21 is an LTS release and gives us records, pattern
# matching, virtual threads, etc.
javaVersion=21

# --- Library versions (kept here so every module agrees) --------------------
# MapStruct generates type-safe DTO<->entity mappers at COMPILE time (no
# reflection, so it is fast and the generated code is debuggable).
mapstructVersion=1.5.5.Final
# Lombok removes boilerplate (getters/setters/builders/loggers) via annotation
# processing.
lombokVersion=1.18.30
# jjwt = Java JWT. Split into api/impl/jackson modules for clean classpath.
jjwtVersion=0.12.5
# springdoc generates OpenAPI 3 docs + Swagger UI from our controllers.
springdocVersion=2.3.0
# Resilience4j provides circuit breaker, retry, rate limiter primitives.
# (Spring Cloud's starter already aligns this, but we pin it for the standalone
#  annotations module used in order-service.)
resilience4jVersion=2.2.0

# --- Gradle daemon / JVM tuning ---------------------------------------------
# Give the Gradle daemon enough heap so large multi-module builds don't thrash.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Run independent module tasks in parallel for faster builds.
org.gradle.parallel=true
# Reuse outputs from previous builds when inputs are unchanged.
org.gradle.caching=true
