# =============================================================================
# gradle.properties — Centralized Version Catalog for SmartShop
# =============================================================================
#
# WHY THIS FILE EXISTS:
# In a multi-module project, if you hardcode version strings in each
# build.gradle.kts, you risk "dependency hell": different modules accidentally
# pulling in different versions of the same library, causing ClassNotFound or
# NoSuchMethod errors at runtime. By centralizing ALL versions here, you:
#   1. Change a version in ONE place and it applies everywhere.
#   2. Get a clear, auditable list of every dependency version in the project.
#   3. Avoid the "it works on my machine" problem caused by transitive version conflicts.
#
# Gradle reads this file automatically before any build script runs.
# Values are accessible in build.gradle.kts as: val springBootVersion: String by project
# =============================================================================

# --- Core Framework Versions ---
springBootVersion=3.2.3
springCloudVersion=2023.0.0

# --- Language & Build Tool Versions ---
javaVersion=21

# --- Database & Migration ---
postgresqlDriverVersion=42.7.2
flywayVersion=10.8.1

# --- Security ---
jjwtVersion=0.12.5

# --- Search ---
# Elasticsearch client version must match the ES server version in docker-compose
elasticsearchVersion=8.12.2

# --- Mapping & Code Generation ---
mapstructVersion=1.5.5.Final
lombokVersion=1.18.32
lombokMapstructBindingVersion=0.2.0

# --- API Documentation ---
springdocVersion=2.3.0

# --- Observability ---
# Micrometer Tracing replaces Spring Cloud Sleuth in Spring Boot 3.x
micrometerTracingVersion=1.2.3
zipkinReporterVersion=3.2.1

# --- Messaging ---
# Spring Kafka version is managed by Spring Boot BOM, listed here for documentation
kafkaVersion=3.6.1

# --- Caching ---
# Spring Data Redis version is managed by Spring Boot BOM

# --- Resilience ---
# Resilience4j version is managed by Spring Boot BOM via spring-cloud BOM

# --- Testing ---
junitVersion=5.10.2
testcontainersVersion=1.19.6
