# Notification-service HTTP port for actuator and Swagger.
server:
  port: 8085

# Spring application, config client, Kafka, mail, and template settings.
spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8888
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  mail:
    host: localhost
    port: 1025
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

# Notification-specific settings.
notification:
  mock: true
  from: no-reply@smartshop.local

# Eureka discovery settings.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Actuator and tracing settings.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Logging pattern includes trace/span ids for event processing diagnostics.
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
