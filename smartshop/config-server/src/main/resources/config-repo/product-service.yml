# =============================================================================
# config-repo/product-service.yml — Configuration for product-service
# =============================================================================

server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartshop_products
    username: smartshop
    password: smartshop_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  elasticsearch:
    uris: http://localhost:9200
    # In production, add username/password for secured Elasticsearch
    # username: elastic
    # password: ${ES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.smartshop.product: DEBUG
    org.springframework.data.elasticsearch: DEBUG
