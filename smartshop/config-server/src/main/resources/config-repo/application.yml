# =============================================================================
# config-repo/application.yml — Global Default Configuration
# Served to ALL services as the base layer of configuration.
# Service-specific files (user-service.yml) override these values.
# =============================================================================

# Global actuator settings for all services
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      show-details: always
  tracing:
    # Sample 100% of traces in development; reduce to 0.1 (10%) in production
    # to avoid overwhelming Zipkin with data
    sampling:
      probability: 1.0

# Zipkin distributed tracing — all services send traces here
spring:
  zipkin:
    base-url: http://localhost:9411
    sender:
      type: web   # Send traces over HTTP (alternative: Kafka for high-volume production)

# Eureka client settings shared by all microservices
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    preferIpAddress: true
    # How often each service renews its Eureka lease (heartbeat interval)
    leaseRenewalIntervalInSeconds: 10
    # How long Eureka waits before removing a service that stopped sending heartbeats
    leaseExpirationDurationInSeconds: 30

logging:
  level:
    root: INFO
    com.smartshop: DEBUG
