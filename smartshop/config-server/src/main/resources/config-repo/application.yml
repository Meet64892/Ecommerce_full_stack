# =============================================================================
# config-repo/application.yml — GLOBAL defaults served to EVERY service
# =============================================================================
# Spring Cloud Config merges the most-specific file over this one, so settings
# common to all services (Eureka location, tracing, actuator) live here exactly
# once. A service-specific file only needs to override or add what differs.
# =============================================================================

eureka:
  client:
    service-url:
      # Single source of truth for the registry location for ALL clients.
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    # Register using a unique instance id so multiple instances of the same
    # service don't collide in the registry dashboard.
    instance-id: ${spring.application.name}:${random.value}
    # Prefer IP address registration — more reliable than hostnames inside
    # containers where DNS may be inconsistent.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # Expose the endpoints we rely on for ops + tracing introspection.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Show component breakdown and the liveness/readiness probe groups.
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      # Sample 100% of requests in dev so every call shows up in Zipkin. In
      # production you'd lower this (e.g. 0.1) to control overhead/storage.
      probability: 1.0
  zipkin:
    tracing:
      # Where Micrometer Tracing ships spans. Zipkin's collector listens here.
      endpoint: ${ZIPKIN_URI:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    # Inject the distributed-tracing ids into every log line via MDC so logs
    # from different services can be stitched into one trace. traceId lets you
    # follow a single request across service boundaries; spanId is one hop.
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
