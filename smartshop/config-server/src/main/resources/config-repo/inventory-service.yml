# =============================================================================
# config-repo/inventory-service.yml — Configuration for inventory-service
# =============================================================================

server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartshop_inventory
    username: smartshop
    password: smartshop_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis configuration for caching
  data:
    redis:
      host: localhost
      port: 6379
      # password: ${REDIS_PASSWORD}  # Uncomment in production
      database: 0   # Redis has 16 databases (0-15); use different DBs per environment
      timeout: 2000ms   # Connection timeout; important to avoid hanging on Redis down
      lettuce:
        pool:
          # Connection pooling: reuse connections rather than creating new ones per request.
          # min-idle connections are kept alive to avoid connection setup latency.
          max-active: 8
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      # Default TTL for ALL cache entries (can be overridden per cache)
      # TTL = Time To Live; after this duration, the entry is automatically evicted.
      # Why have TTL? Without TTL, stale data lives forever in the cache.
      time-to-live: 300000   # 5 minutes in milliseconds

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

logging:
  level:
    com.smartshop.inventory: DEBUG
    org.springframework.data.redis: DEBUG
