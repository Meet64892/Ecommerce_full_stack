# Order-service HTTP port.
server:
  port: 8083

# Spring application, config, datasource, JPA, Flyway, and Kafka settings.
spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/smartshop_orders
    username: postgres
    password: smartshop
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest

# Eureka discovery settings.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Actuator and tracing settings.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Log pattern shows Micrometer trace/span ids propagated via B3 headers.
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
