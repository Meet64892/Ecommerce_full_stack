# =============================================================================
# order-service application.yml — base config (web, JPA, Kafka, resilience)
# =============================================================================

server:
  port: 8083

spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartshop_orders}
    username: ${DB_USER:smartshop}
    password: ${DB_PASSWORD:smartshop}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    # Broker list. In docker-compose this is the kafka service name.
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      # Keys are plain strings (orderId); values are JSON-serialized events.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all => wait for all in-sync replicas to ack before considering the
      # send successful (strongest durability; pairs with at-least-once).
      acks: all
    consumer:
      # All instances of this service share one group so partitions are split
      # among them (scaling) while still seeing each message once per group.
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # Start at the earliest offset if this group has no committed offset yet.
      auto-offset-reset: earliest
      properties:
        # Trust our event packages for JSON deserialization (security guard).
        spring.json.trusted.packages: "com.smartshop.*"
        # Map incoming JSON to this type when no __TypeId__ header is present.
        spring.json.value.default.type: com.smartshop.order.event.InventoryCheckedEvent

# Resilience4j retry used by the Kafka producer (@Retry name="kafkaPublish").
resilience4j:
  retry:
    instances:
      kafkaPublish:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URI:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
