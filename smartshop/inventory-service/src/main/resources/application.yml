# Inventory-service HTTP port.
server:
  port: 8084

# Spring application, config, datasource, cache, Redis, Flyway, and Kafka settings.
spring:
  application:
    name: inventory-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/smartshop_inventory
    username: postgres
    password: smartshop
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest

# Eureka discovery settings.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Actuator health includes the custom RedisHealthIndicator.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Logs include distributed trace ids propagated by Micrometer/Brave.
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
